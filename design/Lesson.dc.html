<helmet>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#020617;--surface:#0B1220;--surfaceEl:#1E293B;--muted:#111C31;
  --border:#1E2A44;--borderStrong:#2C3B5A;
  --text:#F8FAFC;--text2:#CBD5E1;--text3:#94A3B8;
  --primary:#8B5CF6;--primary2:#A78BFA;--primarySubtle:rgba(139,92,246,.16);
  --success:#34D399;--successSubtle:rgba(52,211,153,.16);
  --danger:#FB7185;--dangerSubtle:rgba(251,113,133,.16);
  --warning:#FBBF24;--warningSubtle:rgba(251,191,36,.16);
  --info:#22D3EE;--infoSubtle:rgba(34,211,238,.16);
  --indigo:#6366F1;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-xxl:28px;--r-pill:999px;
  --sh-sm:0 2px 8px rgba(0,0,0,.16);--sh-md:0 6px 16px rgba(0,0,0,.22);--sh-lg:0 12px 28px rgba(0,0,0,.3);
  --mono:Menlo,ui-monospace,SFMono-Regular,Consolas,monospace;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.display{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.6px;margin:0}
.title{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.4px;margin:0}
.heading{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.2px;margin:0}
.subheading{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.1px;margin:0}
.body{font-size:16px;line-height:25px;font-weight:400;margin:0}
.bodyStrong{font-size:16px;line-height:25px;font-weight:600;margin:0}
.caption{font-size:14px;line-height:20px;font-weight:500;margin:0}
.label{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.6px;margin:0}
.caps{text-transform:uppercase}
.mono{font-family:var(--mono);font-size:14px;line-height:21px;font-weight:500}
.t2{color:var(--text2)}.t3{color:var(--text3)}
.card{background:var(--surface);border-radius:var(--r-xl);padding:16px}
.card.outlined{border:1px solid var(--border)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--r-pill);
  font-size:12px;line-height:16px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.badge.primary{background:var(--primarySubtle);color:var(--primary)}
.badge.success{background:var(--successSubtle);color:var(--success)}
.badge.danger{background:var(--dangerSubtle);color:var(--danger)}
.badge.warning{background:var(--warningSubtle);color:var(--warning)}
.badge.info{background:var(--infoSubtle);color:var(--info)}
.badge.neutral{background:var(--muted);color:var(--text2)}
.badge.fill-info{background:var(--info);color:#04141A}
.badge.fill-primary{background:var(--primary);color:#fff}
.badge.fill-warning{background:var(--warning);color:#2A1A00}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;width:100%;
  border-radius:var(--r-lg);font-size:16px;line-height:25px;font-weight:600;color:#fff;
  height:52px;padding:0 20px;cursor:pointer;font-family:inherit;transition:transform .09s,opacity .09s}
.btn.lg{height:58px;padding:0 24px}
.btn.sm{height:40px;padding:0 16px;font-size:14px;line-height:20px;font-weight:500;width:auto}
.btn.primary{background:var(--primary)}
.btn.success{background:var(--success);color:#022C1E}
.btn.danger{background:var(--danger);color:#2B0710}
.btn.premium{background:var(--warning);color:#2A1A00}
.btn.secondary{background:var(--surfaceEl);border:1px solid var(--borderStrong);color:var(--text)}
.btn:active{transform:translateY(2px) scale(.985);opacity:.92}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.row{display:flex;align-items:center}

/* ---- Lesson ---- */
  body{width:393px;height:852px;overflow:hidden;position:relative}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 20px 16px}
  .topbar .x{color:var(--text3);cursor:pointer}
  .bar{flex:1;height:10px;border-radius:5px;background:var(--muted);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:5px;background:var(--primary);
    transition:width .24s cubic-bezier(.2,0,0,1)}
  .hearts{display:flex;align-items:center;gap:5px;color:var(--text2)}
  .hearts .icon{width:17px;height:17px;color:var(--danger)}

  .scroll{position:absolute;left:0;right:0;top:64px;bottom:0;padding:0 20px;overflow:hidden}
  .stage{animation:stepIn .28s cubic-bezier(0,0,.2,1) both;
    transition:margin-top .34s cubic-bezier(.2,0,0,1)}
  @keyframes stepIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none} }

  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{display:flex;align-items:center;gap:8px;min-height:56px;padding:12px 16px;
    border-radius:var(--r-lg);border:2px solid var(--border);background:var(--surface);
    cursor:pointer;text-align:left;color:var(--text);font-family:inherit;
    font-size:16px;line-height:25px;font-weight:400;transition:border-color .16s,background-color .16s}
  .opt > span{flex:1}
  .opt.dead{cursor:default}
  .opt .mark{width:20px;height:20px;flex:none;display:none}
  .opt[data-state="selected"]{border-color:var(--primary);background:var(--primarySubtle)}
  .opt[data-state="correct"]{border-color:var(--success);background:var(--successSubtle);
    animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
  .opt[data-state="correct"] .m-ok{display:block;color:var(--success)}
  .opt[data-state="incorrect"]{border-color:var(--danger);background:var(--dangerSubtle);
    animation:shake .28s ease-in-out}
  .opt[data-state="incorrect"] .m-no{display:block;color:var(--danger)}
  .opt[data-state="revealed"]{border-color:var(--success);background:transparent;border-style:dashed}
  .opt[data-state="revealed"] .m-rev{display:block;color:var(--success)}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)} }
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)} }

  .numin{width:100%;padding:12px 16px;border-radius:var(--r-lg);border:2px solid var(--border);
    background:var(--surface);color:var(--text);font-family:inherit;
    font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.4px;outline:0}
  .numin:focus{border-color:var(--primary)}
  .numin.ok{border-color:var(--success)}
  .numin.no{border-color:var(--danger)}

  .hint{display:flex;margin-top:20px;cursor:pointer}

  .footer{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 20px;
    background:var(--bg);border-top:1px solid var(--border)}

  /* The sheet caps at 62% of the screen, scrolls its own text, and keeps the
     continue button pinned where the thumb already is. */
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:528px;display:flex;
    flex-direction:column;border-top:2px solid var(--success);
    border-radius:var(--r-xxl) var(--r-xxl) 0 0;background:var(--successSubtle);
    padding:20px;box-shadow:var(--sh-lg);
    animation:sheetUp .38s cubic-bezier(.2,.9,.25,1.02) both}
  @keyframes sheetUp{from{transform:translateY(400px)}to{transform:none} }
  .sheet.wrong{border-top-color:var(--danger);background:var(--dangerSubtle)}
  .sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--success)}
  .sheet .hd-no{display:none}
  .sheet.wrong .hd-ok{display:none}
  .sheet.wrong .hd-no{display:block}
  .sheet.wrong .hd{color:var(--danger)}
  .sheet .scrollin{flex:1 1 auto;min-height:0;overflow:auto;margin-bottom:16px}

  /* Tutor follow-ups read as things you can press, not as metadata. */
  .followups{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .fu{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--r-pill);
    border:1px solid var(--borderStrong);background:rgba(2,6,23,.35);color:var(--text2);
    font-size:14px;line-height:20px;font-weight:500;cursor:pointer;font-family:inherit}
  .fu .icon{width:15px;height:15px;color:var(--primary2)}
  .fu:hover{border-color:var(--primary);color:var(--text)}

  @media (prefers-reduced-motion:reduce){
    .stage,.opt,.sheet{animation:none!important;transition:none!important}
  }
</style>
</helmet>

<div class="topbar">
  <svg class="icon x"><use href="#i-x"/></svg>
  <div class="bar"><i style="width:{{barWidth}}"></i></div>
  <span class="label t3">{{stepNo}}</span>
  <span class="hearts"><svg class="icon"><use href="#i-heart"/></svg><span class="caption">4</span></span>
</div>

<div class="scroll">
  <div class="stage" style="margin-top:{{shift}}px;padding-bottom:{{pad}}px">
    <h2 class="heading" style="margin-bottom:20px">{{prompt}}</h2>

    <sc-if value="{{isChoice}}" hint-placeholder-val="{{ true }}">
      <div class="opts">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
          <button type="button" class="opt {{o.dead}}" data-state="{{o.state}}" onClick="{{o.pick}}">
            <span>{{o.label}}</span>
            <svg class="icon mark m-ok"><use href="#i-check"/></svg>
            <svg class="icon mark m-no"><use href="#i-x"/></svg>
            <svg class="icon mark m-rev"><use href="#i-arrow"/></svg>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isNumeric}}" hint-placeholder-val="{{ false }}">
      <input class="numin {{numTone}}" type="text" placeholder="0"
             value="{{numText}}" onInput="{{setNum}}">
    </sc-if>

    <div class="hint"><span class="badge info">Show a hint · costs some XP</span></div>
  </div>
</div>

<sc-if value="{{showFooter}}" hint-placeholder-val="{{ true }}">
  <div class="footer">
    <button type="button" class="btn primary lg" style="opacity:{{checkOpacity}};cursor:{{checkCursor}}"
            onClick="{{check}}">Check</button>
  </div>
</sc-if>

<sc-if value="{{graded}}" hint-placeholder-val="{{ false }}">
  <div class="sheet show {{sheetTone}}">
    <div class="hd">
      <svg class="icon hd-ok" style="width:22px;height:22px"><use href="#i-check"/></svg>
      <svg class="icon hd-no" style="width:22px;height:22px"><use href="#i-x"/></svg>
      <span class="heading">{{sheetTitle}}</span>
    </div>
    <div class="scrollin">
      <p class="body t2">{{explanation}}</p>
      <div class="followups">
        <sc-for list="{{followups}}" as="f" hint-placeholder-count="2">
          <button type="button" class="fu">
            <svg class="icon"><use href="#i-star"/></svg><span>{{f.label}}</span>
          </button>
        </sc-for>
      </div>
    </div>
    <button type="button" class="btn lg {{continueTone}}" onClick="{{next}}">Continue</button>
  </div>
</sc-if>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
// Two real exercises from the Deep Learning track, graded the way the app
// grades them. The artboard opens on the state this screen exists for — the
// answer is in and the explanation is doing the teaching.
const QUESTIONS = [
  {
    kind: 'choice',
    prompt: 'Why does training a network use much more memory than running it?',
    choices: [
      'Gradients are larger than weights',
      'Forward activations must be cached for the backward pass',
      'The optimizer duplicates the dataset',
      'Training uses higher precision throughout',
    ],
    answer: 1,
    shift: 100,
    explanation:
      'Every intermediate activation is needed to compute local gradients on the way back, so it must be kept alive until then. Gradient checkpointing trades compute for memory by recomputing some activations instead of storing them.',
  },
  {
    kind: 'numeric',
    prompt: 'With ∂L/∂ŷ = 2, ∂ŷ/∂z = 0.5, and ∂z/∂w = 3, what is ∂L/∂w?',
    answer: 3,
    shift: 76,
    explanation:
      '2 × 0.5 × 3 = 3. The chain rule multiplies local derivatives along the path — which is exactly why long chains of small factors cause gradients to vanish.',
  },
];

class Component extends DCLogic {
  state = { i: 0, pick: 0, numText: '', graded: true };

  question() {
    return QUESTIONS[this.state.i];
  }

  isCorrect() {
    const q = this.question();
    if (q.kind === 'choice') return this.state.pick === q.answer;
    return Math.abs(parseFloat(this.state.numText) - q.answer) < 1e-9;
  }

  hasDraft() {
    const q = this.question();
    if (q.kind === 'choice') return this.state.pick !== null;
    return isFinite(parseFloat(this.state.numText));
  }

  renderVals() {
    const q = this.question();
    const graded = this.state.graded;
    const correct = graded && this.isCorrect();
    const ready = this.hasDraft();

    // Colour never carries a state on its own: each one has its own glyph too.
    const options = (q.choices || []).map((label, index) => {
      let state = 'idle';
      if (graded) {
        if (index === q.answer) state = correct ? 'correct' : 'revealed';
        else if (index === this.state.pick) state = 'incorrect';
      } else if (index === this.state.pick) {
        state = 'selected';
      }
      return {
        label,
        state,
          dead: graded ? 'dead' : '',
        pick: () => { if (!graded) this.setState({ pick: index }); },
      };
    });

    return {
      prompt: q.prompt,
      isChoice: q.kind === 'choice',
      isNumeric: q.kind === 'numeric',
      options,
      numText: this.state.numText,
      numTone: graded ? (correct ? 'ok' : 'no') : '',
      setNum: (e) => { if (!graded) this.setState({ numText: e.target.value }); },

      stepNo: (4 + this.state.i) + ' / 9',
      barWidth: (44 + this.state.i * 11) + '%',
      // Standing in for the scroll the app performs, so the option you just
      // answered always clears the sheet explaining it.
      shift: graded ? -q.shift : 0,
      pad: graded ? 420 : 0,

      showFooter: !graded,
      checkOpacity: ready ? 1 : 0.45,
      checkCursor: ready ? 'pointer' : 'default',
      check: () => { if (ready) this.setState({ graded: true }); },

      graded,
      sheetTone: correct ? '' : 'wrong',
      sheetIcon: correct ? '#i-check' : '#i-x',
      sheetTitle: correct ? 'Correct' : 'Not quite',
      continueTone: correct ? 'success' : 'danger',
      explanation: q.explanation,
      followups: (correct
        ? ['Go deeper', 'Real-world example']
        : ['Why was I wrong?', 'Explain more simply']
      ).map((label) => ({ label })),

      next: () =>
        this.setState({
          i: (this.state.i + 1) % QUESTIONS.length,
          pick: null,
          numText: '',
          graded: false,
        }),
    };
  }
}
</script>
</body>
</html>
