<x-dc>
<helmet>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#020617;--surface:#0B1220;--surfaceEl:#1E293B;--muted:#111C31;
  --border:#1E2A44;--borderStrong:#2C3B5A;
  --text:#F8FAFC;--text2:#CBD5E1;--text3:#94A3B8;
  --primary:#8B5CF6;--primary2:#A78BFA;--primarySubtle:rgba(139,92,246,.16);
  --success:#34D399;--successSubtle:rgba(52,211,153,.16);
  --danger:#FB7185;--dangerSubtle:rgba(251,113,133,.16);
  --warning:#FBBF24;--warningSubtle:rgba(251,191,36,.16);
  --info:#22D3EE;--infoSubtle:rgba(34,211,238,.16);
  --indigo:#6366F1;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-xxl:28px;--r-pill:999px;
  --sh-sm:0 2px 8px rgba(0,0,0,.16);--sh-md:0 6px 16px rgba(0,0,0,.22);--sh-lg:0 12px 28px rgba(0,0,0,.3);
  --mono:Menlo,ui-monospace,SFMono-Regular,Consolas,monospace;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.display{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.6px;margin:0}
.title{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.4px;margin:0}
.heading{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.2px;margin:0}
.subheading{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.1px;margin:0}
.body{font-size:16px;line-height:25px;font-weight:400;margin:0}
.bodyStrong{font-size:16px;line-height:25px;font-weight:600;margin:0}
.caption{font-size:14px;line-height:20px;font-weight:500;margin:0}
.label{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.6px;margin:0}
.caps{text-transform:uppercase}
.mono{font-family:var(--mono);font-size:14px;line-height:21px;font-weight:500}
.t2{color:var(--text2)}.t3{color:var(--text3)}
.card{background:var(--surface);border-radius:var(--r-xl);padding:16px}
.card.outlined{border:1px solid var(--border)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--r-pill);
  font-size:12px;line-height:16px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.badge.primary{background:var(--primarySubtle);color:var(--primary)}
.badge.success{background:var(--successSubtle);color:var(--success)}
.badge.danger{background:var(--dangerSubtle);color:var(--danger)}
.badge.warning{background:var(--warningSubtle);color:var(--warning)}
.badge.info{background:var(--infoSubtle);color:var(--info)}
.badge.neutral{background:var(--muted);color:var(--text2)}
.badge.fill-info{background:var(--info);color:#04141A}
.badge.fill-primary{background:var(--primary);color:#fff}
.badge.fill-warning{background:var(--warning);color:#2A1A00}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;width:100%;
  border-radius:var(--r-lg);font-size:16px;line-height:25px;font-weight:600;color:#fff;
  height:52px;padding:0 20px;cursor:pointer;font-family:inherit;transition:transform .09s,opacity .09s}
.btn.lg{height:58px;padding:0 24px}
.btn.sm{height:40px;padding:0 16px;font-size:14px;line-height:20px;font-weight:500;width:auto}
.btn.primary{background:var(--primary)}
.btn.success{background:var(--success);color:#022C1E}
.btn.danger{background:var(--danger);color:#2B0710}
.btn.premium{background:var(--warning);color:#2A1A00}
.btn.secondary{background:var(--surfaceEl);border:1px solid var(--borderStrong);color:var(--text)}
.btn:active{transform:translateY(2px) scale(.985);opacity:.92}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.row{display:flex;align-items:center}

/* ---- Complete ---- */
  body{width:393px;height:852px;overflow:hidden}
  .screen{height:852px;display:flex;flex-direction:column;padding:20px 20px 24px}
  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}

  .medal{position:relative;width:96px;height:96px;border-radius:48px;display:grid;place-items:center;
    background:linear-gradient(140deg,#8B5CF6,#6366F1);box-shadow:0 12px 28px rgba(139,92,246,.35)}
  .medal .icon{width:46px;height:46px;color:#fff}
  .medal::after{content:"";position:absolute;inset:-8px;border-radius:56px;
    border:1px solid rgba(167,139,250,.35)}

  .burst{position:absolute;left:50%;top:50%;width:0;height:0}
  .burst i{position:absolute;width:10px;height:10px;border-radius:5px;margin:-5px 0 0 -5px;
    opacity:0;animation:fly .7s cubic-bezier(.2,0,0,1) forwards}
  @keyframes fly{
    0%{opacity:0;transform:translate(0,0) scale(.4)}
    18%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.9)}
  }

  .stats{display:flex;align-items:center;gap:32px;margin:32px 0 24px}
  .col{display:flex;flex-direction:column;align-items:center;gap:4px}
  .ring{position:relative;width:78px;height:78px}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;color:var(--success);white-space:nowrap}

  .chips{display:flex;flex-direction:column;align-items:center;gap:8px}

  /* Added: what the session actually moved. A reward screen that only shows XP
     tells you that you played; this tells you what you learned. */
  .skills{align-self:stretch;margin-top:24px}
  .skill{display:flex;align-items:center;gap:12px;margin-top:12px}
  .skill .nm{flex:1;min-width:0}
  .skill .track{width:78px;height:6px;border-radius:3px;background:var(--muted);overflow:hidden;position:relative;flex:none}
  .skill .was{position:absolute;left:0;top:0;bottom:0;background:var(--borderStrong);border-radius:3px}
  .skill .now{position:absolute;left:0;top:0;bottom:0;background:var(--success);border-radius:3px;
    animation:grow .62s cubic-bezier(.2,0,0,1) .26s both}
  @keyframes grow{from{width:0} }
  @keyframes sweep{from{stroke-dashoffset:223.05} }
  @property --n{syntax:'<integer>';initial-value:0;inherits:false}
  .count{animation:count 1s cubic-bezier(.2,0,0,1) .16s both;counter-reset:n var(--n)}
  .count::after{content:counter(n)}
  .count.pct::after{content:counter(n) "%"}
  @keyframes count{from{--n:0} }
  .skill .dl{width:40px;text-align:right;color:var(--success)}

  .en{opacity:0;transform:translateY(12px);animation:en .34s cubic-bezier(0,0,.2,1) forwards}
  @keyframes en{to{opacity:1;transform:none} }
  @media (prefers-reduced-motion:reduce){
    .en{animation:none;opacity:1;transform:none}
    .burst i{display:none}
    .skill .now,.count,#arc{animation:none}
    .count::after{content:counter(n)}
    .count.pct::after{content:counter(n) "%"}
  }
</style>
</helmet>

<div class="screen">
  <div class="mid">
    <div class="en" style="position:relative;animation-delay:0s">
      <div class="burst">
        <i style="--dx:130.0px;--dy:0.0px;background:#34D399;animation-delay:0ms"></i>
        <i style="--dx:120.1px;--dy:49.7px;background:#8B5CF6;animation-delay:8ms"></i>
        <i style="--dx:91.9px;--dy:91.9px;background:#22D3EE;animation-delay:16ms"></i>
        <i style="--dx:49.7px;--dy:120.1px;background:#34D399;animation-delay:24ms"></i>
        <i style="--dx:0.0px;--dy:130.0px;background:#8B5CF6;animation-delay:32ms"></i>
        <i style="--dx:-49.7px;--dy:120.1px;background:#22D3EE;animation-delay:40ms"></i>
        <i style="--dx:-91.9px;--dy:91.9px;background:#34D399;animation-delay:48ms"></i>
        <i style="--dx:-120.1px;--dy:49.7px;background:#8B5CF6;animation-delay:56ms"></i>
        <i style="--dx:-130.0px;--dy:0.0px;background:#22D3EE;animation-delay:64ms"></i>
        <i style="--dx:-120.1px;--dy:-49.7px;background:#34D399;animation-delay:72ms"></i>
        <i style="--dx:-91.9px;--dy:-91.9px;background:#8B5CF6;animation-delay:80ms"></i>
        <i style="--dx:-49.7px;--dy:-120.1px;background:#22D3EE;animation-delay:88ms"></i>
        <i style="--dx:-0.0px;--dy:-130.0px;background:#34D399;animation-delay:96ms"></i>
        <i style="--dx:49.7px;--dy:-120.1px;background:#8B5CF6;animation-delay:104ms"></i>
        <i style="--dx:91.9px;--dy:-91.9px;background:#22D3EE;animation-delay:112ms"></i>
        <i style="--dx:120.1px;--dy:-49.7px;background:#34D399;animation-delay:120ms"></i>
      </div>
      <div class="medal"><svg class="icon"><use href="#i-star"/></svg></div>
    </div>

    <h1 class="title en" style="margin-top:24px;animation-delay:.06s">Well done</h1>

    <div class="stats en" style="animation-delay:.12s">
      <div class="col">
        <span class="display" style="color:var(--primary)">+<span class="count" style="--n:68"></span></span>
        <span class="label caps t3">XP earned</span>
      </div>
      <div class="col">
        <div class="ring" role="img" aria-label="Accuracy 92 percent">
          <svg width="78" height="78" viewBox="0 0 78 78">
            <circle cx="39" cy="39" r="35.5" fill="none" stroke="#111C31" stroke-width="7"/>
            <circle id="arc" cx="39" cy="39" r="35.5" fill="none" stroke="#34D399" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="223.05" stroke-dashoffset="17.84"
              style="animation:sweep .9s cubic-bezier(.2,0,0,1) .26s both"/>
          </svg>
          <span class="val heading count pct" style="--n:92"></span>
        </div>
        <span class="label caps t3" style="margin-top:4px">Accuracy</span>
      </div>
    </div>

    <div class="chips en" style="animation-delay:.18s">
      <span class="badge fill-primary">Level up! · Level 7</span>
      <span class="badge fill-warning">2 new achievements</span>
    </div>

    <section class="card outlined skills en" style="animation-delay:.24s">
      <p class="label caps t3">What you strengthened</p>
      <div class="skill">
        <span class="nm caption">Backpropagation</span>
        <span class="track"><i class="was" style="width:41%"></i><i class="now" style="width:68%"></i></span>
        <span class="dl label">+27</span>
      </div>
      <div class="skill">
        <span class="nm caption">Chain rule</span>
        <span class="track"><i class="was" style="width:55%"></i><i class="now" style="width:74%"></i></span>
        <span class="dl label">+19</span>
      </div>
      <div class="skill">
        <span class="nm caption">Vanishing gradients</span>
        <span class="track"><i class="was" style="width:12%"></i><i class="now" style="width:31%"></i></span>
        <span class="dl label">+19</span>
      </div>
      <p class="caption t3" style="margin-top:12px">Next review in 3 days.</p>
    </section>
  </div>

  <button class="btn primary lg en" style="animation-delay:.3s" type="button">Continue</button>
</div>
